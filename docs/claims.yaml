      losses are 0.9-2.2 times the Century estimates across regions (median
      1.65x), larger in seven of eight regions and smaller in relative terms
      only in Sub-Saharan Africa; the median moves 1.56-1.77 across a clay+silt
      range of 0.35-0.75, and roughly half of equilibrium MAOM formation
      arrives by direct DOM sorption.
    location: "MS [Results, structural sensitivity]; MS [Discussion, parameter uncertainty]; SI [Note 2]; SI [table 2]"
    status: current
    artifact: results/fourpool_comparison.json
    depends_on_params: []
    note: >-
