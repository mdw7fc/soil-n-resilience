  # ------------------------------------------------------ 05x: shock calibration
  - id: C-050
    text: >-
      Under a sustained fertilizer price scenario calibrated to reduce regional
      fertilizer use by approximately 20% under S1 (a +104% price shock ...), the
      depletion-driven compensation channel active in S3 partially offsets the
      response, so the realized S3 reduction averages approximately 20% over the
      sustained-disruption period.
    location: "MS [56]; MS [65]; SI [78]; SI [151]"
    status: current
    artifact: results/s3_shock_calibration.csv
    depends_on_params: [eps_F_N, fert_reduction_target]
    document_edit_owed: >-
      State the aggregation basis, and report the S3 figure as 19%, not 20%. The
      gap between the calibrated reduction and the realized one IS the depletion
      feedback, and rounding it away erases the mechanism S3 exists to
      demonstrate. F-015.
    note: >-
      All three numbers agree inside the precision the sentence itself states.
      The defect F-015 found is not in either number; it is that the sentence does
      not say on what basis the reduction is averaged, and the two available bases
      are not close (0.1911 on nitrogen tonnage against 0.1872 on production).
      The sustained-disruption period is declared as years 1-10 in the generator
      rather than chosen once the numbers were visible.
    checks:
      - {id: shock_pct,             stated: 104.0, tol: 1.0, units: "% price increase",   select: {kind: derived, name: s3_solved_shock_pct}}
      - {id: s1_reduction_pct,      stated: 20.0,  tol: 1.0, units: "% N-tonnage cut",    select: {kind: derived, name: s3_global_reduction, args: {column: s1_reduction_yr1}}}
      - {id: s3_sustained_mean_pct, stated: 19.0,  tol: 1.0, units: "% N-tonnage cut",    select: {kind: derived, name: s3_global_reduction, args: {column: s3_reduction_mean}}}

