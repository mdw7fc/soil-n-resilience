# Claim register — ERFS-100341 "soil resilience"
#
# Spec: FINDINGS F-012, F-013, F-015, F-016. Rebuilt under WP5 of the v15 rebuild.
#
# WHAT THIS FILE IS
#   Every quantitative claim the manuscript, the SI or the author response makes,
#   with the sentence that states it, the artifact that should produce it, and one
#   or more arithmetic checks over that artifact.
#
# WHAT THIS FILE IS NOT
#   `text` and `location` are transcribed verbatim from the submitted documents.
#   They record what has been claimed. They are NOT a target the model may be
#   tuned toward. When a check disagrees, the default repair is to the document.
#   Tolerances come from each sentence's own stated precision and may not be
#   widened to make a claim agree.
#
# THE INDEX IS TWO-WAY
#   `depends_on_params` here is the reverse index of `affects_claims` in
#   `code/model/params.yaml`. `test_claims.py` checks both directions. A claim
#   that names a parameter which does not name it back stops the build, and so
#   does a parameter that names a claim which does not exist here.
#
# DOCUMENT BASIS
#   Unless a claim says otherwise, `location` refers to the v17 release set
#   (`resumbission/v17/Wallenstein-Manning_ERFS_{manuscript,SI}_v17-clean.docx`,
#   `Author_Response_ERFS-100341_v17-clean.docx`), rebased 2026-08-29 under
#   F-026. Paragraph indices carried over from v14 are approximate where v17
#   inserted paragraphs and are re-verified claim by claim. Paragraph numbers are the
#   1-based index over all paragraphs minus one, which is the numbering used
#   throughout FINDINGS.md. C-033 is the one exception and says so.

