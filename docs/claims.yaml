      audit rounds had withdrawn; the 4-pool engine now lives in the deposit
      (code/model/som_4pool_monthly.py + coupled_4pool.py, node
      fourpool_comparison) and runs the corrected core (ERA5, realized
      clearing, stationary spin-up, production-path calibration). Tolerances
