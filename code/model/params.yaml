# =====================================================================
# params.yaml -- the parameter registry for ERFS-100341
# "Soil organic matter buffers fertilizer supply disruptions"
#
# v15. Reconstructed 2026-07-25 from outputs/table_S1_parameters.md and
# findings F-001, F-006, F-007 and F-011 after the v15 working tree was lost.
#
# DIRECTION OF AUTHORITY (F-011). This file drives the model. The four
# modules soil_n_model.py, coupled_econ_biophysical.py, prices.py and
# monthly_model_v3.py read their constants from registry.py at import.
# Editing a value here changes the model. It is not documentation.
#
# SCHEMA. Every entry may carry:
#   value                 scalar, per-region mapping, or named-leaf mapping
#   units                 unit string; checked against soc_profile_depth_cm
#                         where the string names a profile depth
#   category              measured | calibrated | judgment | derived
#   source                provenance, with DOI or URL where one exists
#   used_by               module.symbol readers, for the wiring table
#   affects_claims        claim IDs in docs/claims.yaml
#   benchmark             benchmark IDs in data/benchmarks/observed_values.yaml
#   mc                    drawn | declared_fixed | exempt | not_applicable
#   mc_exempt_reason      required whenever mc is not 'drawn'
#   uncertainty           the prior run_mc_ensemble.py ACTUALLY DRAWS (F-007)
#   derived_from          the expression, for category: derived
#   superseded_by         the symbol that replaced this parameter's mechanism
#   superseded_note       why the entry survives despite being superseded
#   documented_as         a surviving v15 artifact records a different value;
#                         the code is authoritative and the artifact owes an edit
#
# UNCERTAINTY BLOCKS ARE THE DRAWN PRIOR, NOT THE DECLARED ONE (F-007).
# Six of six comparable priors disagreed between this file and the ensemble.
# The ensemble is what ran, so this file was the side that was wrong, and each
# of the six blocks below has been rewritten to the drawn prior with a dated
# note saying so. Editing the ensemble instead would have made the published
# credible intervals unreproducible from the code that produced them.
#
# REGION ORDER is canonical everywhere: north_america, europe, east_asia,
# south_asia, southeast_asia, latin_america, sub_saharan_africa,
# fsu_central_asia.
# =====================================================================

schema_version: 2
registry_version: v15
regions:
  - north_america
  - europe
  - east_asia
  - south_asia
  - southeast_asia
  - latin_america
  - sub_saharan_africa
  - fsu_central_asia

parameters:

  # -------------------------------------------------------------------
  # Unit conversions and accounting conventions
  # -------------------------------------------------------------------

  cm2_per_ha:
    value: 1.0e+08
    units: cm2 per ha
    category: measured
    source: Exact by definition of the unit
    used_by: [registry.soc_tha_per_pct]
    mc: exempt
    mc_exempt_reason: Exact by definition; not an uncertain quantity.

  g_per_t:
    value: 1.0e+06
    units: g per t_C
    category: measured
    source: Exact by definition of the unit
    used_by: [registry.soc_tha_per_pct]
    mc: exempt
    mc_exempt_reason: Exact by definition; not an uncertain quantity.

  pct_to_fraction:
    value: 0.01
    units: dimensionless per pct_SOC
    category: measured
    source: Exact by definition of the unit
    used_by: [registry.soc_tha_per_pct]
    mc: exempt
    mc_exempt_reason: Exact by definition; not an uncertain quantity.

  soc_bulk_density:
    value: 1.3
    units: g per cm3
    category: judgment
    source: Representative cultivated-topsoil bulk density
    used_by: [registry.soc_tha_per_pct]
    mc: declared_fixed
    mc_exempt_reason: >-
      Enters only through the derived soc_tha_per_pct, which is an accounting
      convention for converting a reported stock to a reported percentage.
      Varying it would change the units of the answer rather than the answer.
      Its effect is measured instead by test_soc_conversion_invariance.

  soc_profile_depth_cm:
    value: 30
    units: cm
    category: judgment
    source: Model convention, stated once here
    used_by: [registry.soc_tha_per_pct, registry.check_profile_depth_units]
    mc: exempt
    mc_exempt_reason: >-
      A convention, not an uncertain quantity. Changing it changes what the
      model means rather than how uncertain the model is. It is registered so
      that whc_sensitivity's units string can be checked against it.
    guarded_at_load: profile_depth_units

  soc_tha_per_pct:
    value: 39.0
    units: t_C per ha per pct_SOC
    category: derived
    derived_from: soc_bulk_density * soc_profile_depth_cm * cm2_per_ha / g_per_t * pct_to_fraction
    source: 'derived: soc_bulk_density * soc_profile_depth_cm * cm2_per_ha / g_per_t * pct_to_fraction'
    used_by: [soil_n_model.soc_pct_from_tha, coupled_monthly.MonthlyBiophysicalEngine]
    affects_claims: [C-001, C-014]
    mc: not_applicable
    mc_exempt_reason: Derived; cannot be set independently of its four factors.

  urea_n_fraction:
    value: 0.46
    units: dimensionless
    category: measured
    source: Stoichiometric nitrogen content of urea, CO(NH2)2
    used_by: [prices.n_price_usd_kg]
    mc: exempt
    mc_exempt_reason: A stoichiometric constant, not an uncertain quantity.

  # -------------------------------------------------------------------
  # Soil organic matter kinetics
  # -------------------------------------------------------------------

  som_decay_rates:
    value:
      k_active: 0.33
      k_slow: 0.03705
      k_passive: 0.000728
    units: per year
    category: calibrated
    source: Century-family first-order decay constants, temperate regime
    used_by: [soil_n_model.SOMPoolParams]
    affects_claims: [C-010, C-011, C-061]
    benchmark: [B2]
    mc: drawn
    uncertainty:
      applies_to: k_slow
      family: truncnorm
      mode: multiplier
      mean: 1.0
      sd: 0.20
      low: 0.60
      high: 1.40
      ensemble_symbol: run_mc_ensemble.PRIORS['k_slow_mult']
      note: >-
        2026-07-25 (F-007): corrected from a declared sd 0.15 on [0.6, 1.5].
        params.yaml was the side that was wrong. The ensemble drew
        sd 0.20 on [0.60, 1.40] and the ensemble is what ran, so the declared
        block has been rewritten to the drawn prior rather than the ensemble
        edited to the declared one. Only k_slow is drawn; k_active and
        k_passive are held at their Century values.

  som_humification:
    value:
      h_active_to_slow: 0.40
      h_slow_to_passive: 0.03
    units: dimensionless
    category: judgment
    source: Century-family humification efficiencies
    used_by: [soil_n_model.SOMPoolParams, monthly_model_v3.update_som_pools]
    affects_claims: [C-010, C-011]
    mc: declared_fixed
    mc_exempt_reason: >-
      The active-to-slow and slow-to-passive transfer efficiencies. Not drawn
      because the k_slow prior already moves the slow pool's turnover, and over
      a 30-year horizon a humification error and a decay error are close to
      indistinguishable in the reported stock trajectory. SI limitation:
      pool-transfer efficiencies are fixed at Century-family values and the SOC
      interval covers turnover uncertainty through k_slow alone; structural
      sensitivity here is tested by the four-pool comparison rather than by the
      ensemble.

  som_pool_cn:
    value:
      cn_active: 8.0
      cn_slow: 12.0
      cn_passive: 12.0
    units: g_C per g_N
    category: measured
    source: Century-family pool C:N ratios
    used_by: [soil_n_model.SOMPoolParams, monthly_model_v3.update_som_pools]
    mc: exempt
    mc_exempt_reason: >-
      Pool C:N enters only the mineralization stoichiometry, which is
      constrained by the Seam B mass balance; the mass balance holds for any
      declared C:N, and the paper reports no quantity sensitive to it at the
      precision the ensemble could resolve. Flagged for review by the mutation
      harness rather than assumed harmless.

  som_pool_fractions:
    value:
      f_active: 0.04
      f_slow: 0.38
      f_passive: 0.58
    units: dimensionless
    category: measured
    source: Century-family pool partitioning for temperate cultivated soils
    used_by: [soil_n_model.SOMPoolParams]
    mc: exempt
    guarded_at_load: sum_to_one
    mc_exempt_reason: >-
      2026-07-25 (F-001): the reported outcomes are invariant to this
      partition, which is a weaker statement than the one recorded here before
      today. The earlier reason claimed the dynamic spin-up overwrites the
      initial partition entirely. It does not, and
      test_spinup_partition_independence.py was written to check that claim and
      falsified it: with k_passive at 0.000728 per year the passive pool has a
      1374-year turnover time, while the spin-up's convergence criterion
      (fractional SOC drift below 0.002 over a 50-year window) is met after
      about a century. The active and slow pools do reach equilibrium in that
      time and are partition-independent to within the asserted fast-pool
      tolerance; the passive pool does not, and the total SOC the spin-up
      delivers therefore still carries the assumed passive fraction. Run to a
      true fixed point (n_spinup 20000, tol 1e-6) every starting partition
      lands on the same SOC, so the equilibrium itself is partition-independent;
      the shipped spin-up simply does not run that far, and should not, because
      the model's own equilibrium would replace a measured stock with an
      inferred one. What licenses the exemption is the measured sensitivity of
      the published quantities: over f_passive 0.45 to 0.73 the S3 year-1 and
      year-10 yield losses move by less than 0.05 percentage points in every
      region against a reporting precision of 0.1, while absolute SOC moves by
      more than 8 t C/ha in every temperate region. The water-stress term
      responds to SOC change measured against each run's own equilibrium, and
      the passive pool contributes about 2 percent of N mineralization. SI
      limitation: absolute SOC is initialization, not prediction, anchored on
      measurement in temperate regions and on model kinetics in tropical ones,
      so absolute stocks are not comparable across regimes even though relative
      changes are. Point values are deliberately not restated here; the
      measured characterisation is written by the test to
      results/spinup_partition_characterisation.yaml on every run and is cited
      from there.

  laub_tropical_ratios:
    value:
      k_slow_ratio: 1.30
      k_passive_ratio: 1.71
    units: dimensionless
    category: measured
    source: Laub et al. (2024) Biogeosciences 21:3691-3716; doi:10.5194/bg-21-3691-2024
    used_by: [soil_n_model.SOMPoolParams.tropical]
    mc: exempt
    mc_exempt_reason: >-
      A ratio between two published parameterisations, varied implicitly
      through the som_decay_rates multiplier which scales the temperate and
      tropical rates together.

  residue_c_to_active_fraction:
    value: 0.90
    units: dimensionless
    category: judgment
    source: Century-family structural partition of fresh residue carbon
    used_by: [monthly_model_v3.update_som_pools]
    affects_claims: [C-010, C-011]
    mc: declared_fixed
    mc_exempt_reason: >-
      Wired but not drawn. Outside the SOC unit conversions this is the only
      registered parameter the published canonical run reads at all (F-006),
      and the mutation sweep measured a 10 percent perturbation moving
      southeast Asia year-1 loss by 2.5e-2 percentage points, the largest reach
      of any registered leaf. It was a bare literal at two use sites until
      2026-07-25, so no ensemble that has run could have drawn it. SI
      limitation: the structural residue-carbon split is fixed at 0.90/0.10;
      its measured reach is small against the reported interval, but it is
      unsampled and the next ensemble should draw it.

  cre_allocation:
    value:
      cre_to_active: 0.60
      cre_to_slow: 0.40
    units: dimensionless
    category: judgment
    source: Century-family allocation of retained carbon between the fast pools
    used_by: [soil_n_model.FeedbackParams]
    mc: exempt
    guarded_at_load: sum_to_one
    mc_exempt_reason: >-
      The split redistributes a fixed carbon input between two pools whose
      combined stock is what the reported SOC change measures. Perturbation
      moves the partition of a small flux, not its magnitude. Flagged for the
      mutation harness to confirm rather than assumed.

  cre_regional:
    value:
      north_america: 0.280
      europe: 0.259
      east_asia: 0.226
      south_asia: 0.341
      southeast_asia: 0.307
      latin_america: 0.308
      sub_saharan_africa: 0.20
      fsu_central_asia: 0.35
    units: dimensionless
    category: calibrated
    source: Regionalised carbon retention efficiency
    used_by: [soil_n_model.RegionParams, monthly_model_v3.run_model]
    affects_claims: [C-010, C-011]
    benchmark: [B2]
    mc: drawn
    uncertainty:
      family: truncnorm
      mode: multiplier
      mean: 1.0
      sd: 0.30
      low: 0.40
      high: 1.80
      clip_absolute: [0.01, 0.99]
      ensemble_symbol: run_mc_ensemble.PRIORS['cre_regional_mult']
      note: >-
        2026-07-25 (F-007): corrected from a declared sd 0.20 on an absolute
        clip of [0.05, 0.6]. params.yaml was the side that was wrong. The
        ensemble drew sd 0.30 on a MULTIPLIER of [0.40, 1.80], then clipped
        absolutely to [0.01, 0.99]. The old block wrote two different
        quantities into one pair of fields: [0.05, 0.6] was an absolute
        retention range while low/high in every other block are multipliers on
        the central value. That is F-005's error class, a number recorded
        without its basis, which is why clip_absolute is now an explicit pair
        rather than a bare boolean.

  residue_retention:
    value:
      north_america: 0.90
      europe: 0.90
      east_asia: 0.75
      south_asia: 0.50
      southeast_asia: 0.70
      latin_america: 0.80
      sub_saharan_africa: 0.55
      fsu_central_asia: 0.85
    units: dimensionless
    category: judgment
    source: Regional crop-residue retention fractions
    used_by: [soil_n_model.RegionParams, monthly_model_v3.run_model]
    affects_claims: [C-010, C-011]
    benchmark: [B2]
    mc: drawn
    uncertainty:
      family: truncnorm
      mode: multiplier
      mean: 1.0
      sd: 0.10
      low: 0.80
      high: 1.15
      ensemble_symbol: run_mc_ensemble.PRIORS['residue_retention_mult']
      note: >-
        2026-07-25 (F-007): corrected from a declared sd 0.15 on [0.6, 1.3].
        params.yaml was the side that was wrong. The ensemble drew sd 0.10 on
        [0.80, 1.15]. The declared prior was WIDER than the drawn one in both
        directions, so the SI table had been advertising an input-carbon
        uncertainty roughly three times the width of the one that was actually
        propagated.

  root_shoot_c_ratio:
    value:
      north_america: 0.80
      europe: 0.80
      east_asia: 0.60
      south_asia: 0.70
      southeast_asia: 0.60
      latin_america: 0.90
      sub_saharan_africa: 1.0
      fsu_central_asia: 1.0
    units: dimensionless
    category: judgment
    source: Regional root-to-shoot carbon ratios for the dominant cereal mix
    used_by: [soil_n_model.RegionParams, monthly_model_v3.run_model]
    affects_claims: [C-010]
    mc: declared_fixed
    mc_exempt_reason: >-
      Scales the below-ground half of the annual residue-carbon input, which
      the model forms as a SUM rather than a product: c_in is proportional to
      (residue_retention + root_shoot_c_ratio) at monthly_model_v3:505-507. The
      ensemble draws residue_retention, so only the shoot term varies. This is
      an understatement rather than a cancellation, and naming it as one is the
      point of this entry. SI limitation: input-side carbon uncertainty is
      propagated on roughly half the input, so the reported SOC interval is
      narrower than an input-complete ensemble would give. F-007 records that
      this one should be drawn in the next ensemble.

  soc_initial:
    value:
      north_america: 50.0
      europe: 42.0
      east_asia: 35.0
      south_asia: 25.0
      southeast_asia: 32.0
      latin_america: 45.0
      sub_saharan_africa: 9.0
      fsu_central_asia: 35.0
    units: t_C per ha
    category: measured
    source: SoilGrids 250m cropland SOC stock, 0-30 cm, regional medians; https://soilgrids.org/
    used_by: [soil_n_model.RegionParams]
    affects_claims: [C-001, C-014]
    mc: declared_fixed
    mc_exempt_reason: >-
      Not a free parameter of the run. It is the anchor the spin-up targets,
      and engine_at_soc rescales the pools to it, so a draw would move the
      starting point and the calibration target together. The paper reports
      fractional losses relative to each region's own baseline, which removes
      the level but not the nitrogen-supply effect of a larger stock, and that
      residual effect is unsampled. SI limitation: absolute SOC stocks are
      initialisation anchored, on measurement in temperate regions and on model
      kinetics in tropical ones (F-001), and the measurement uncertainty of the
      source product is not propagated.

  cn_bulk:
    value:
      north_america: 10.0
      europe: 10.5
      east_asia: 10.0
      south_asia: 9.5
      southeast_asia: 10.0
      latin_america: 11.0
      sub_saharan_africa: 11.0
      fsu_central_asia: 10.0
    units: g_C per g_N
    category: measured
    source: Bulk soil C:N ratios for cultivated soils, regional means
    used_by: [soil_n_model.RegionParams, monthly_model_v3.update_som_pools]
    mc: declared_fixed
    mc_exempt_reason: >-
      The bulk soil C:N ratio converts mineralized carbon to mineralized
      nitrogen. Not drawn because the ensemble already samples k_slow, and
      delivered nitrogen is to first order the quotient of the two, so a 10
      percent error in C:N and a 10 percent error in decay are the same 10
      percent error in the nitrogen the crop sees. Drawing both would report
      one uncertain number as two. SI limitation: the mineralization interval
      should be read as covering decay and stoichiometry jointly through the
      k_slow prior; the carbon-stock trajectory, which responds to k_slow
      alone, is the one place the two are separable.

  # -------------------------------------------------------------------
  # Water
  # -------------------------------------------------------------------

  whc_sensitivity:
    value: 3.48
    units: mm_water per pct_SOC per 30cm_profile
    category: measured
    source: Minasny & McBratney (2018) Eur J Soil Sci 69:39-47; doi:10.1111/ejss.12475
    used_by: [soil_n_model.RegionParams, coupled_monthly.MonthlyBiophysicalEngine]
    affects_claims: [C-014, C-021]
    benchmark: [B4]
    documented_as: >-
      2026-07-25 (WP1 rebuild): v15/outputs/table_S1_parameters.md prints this
      row as 3.5 and FINDINGS F-008 records it as "3.48, registered as 3.5".
      The code carries 3.48 (1.16 mm per 100 mm soil per percentage point SOC
      over a 300 mm profile = 1.16 * 3). Registering 3.5 moves sixteen of the
      123 canonical fields at the 1e-5 relative level, which would break the
      WP1 no-op acceptance test, so the code's 3.48 stands and Table S1 owes
      the edit. C-021's manuscript correction is 8.4 -> 3.48, which is 3.5 at
      the two significant figures the manuscript states.
    mc: drawn
    uncertainty:
      family: truncnorm
      mode: multiplier
      mean: 1.0
      sd: 0.35
      low: 0.657
      high: 2.40
      declared_absolute_bounds: [2.3, 8.4]
      ensemble_sig_figs: 3
      rounding_reason: >-
        The ensemble writes the lower bound as 0.657, which is three
        significant figures of 2.3 / 3.5 = 0.657143, so it draws from 2.2995 mm
        rather than 2.3 mm. Neither side was edited. Changing the ensemble
        literal would move the support of a truncated normal and therefore
        every draw, to correct 0.02 percent of one bound of a meta-analytic
        range.
      ensemble_symbol: run_mc_ensemble.PRIORS['whc_sensitivity_mult']
      note: >-
        2026-07-25 (F-007): this is the one comparable prior of the six where
        neither side was edited, because the discrepancy is a declared
        transcription rounding rather than a disagreement. It is recorded here
        as the multiplier the ensemble draws, with the absolute bounds the SI
        states given separately, so the basis of each number is explicit.

  water_stress_coeff:
    value:
      north_america: 0.003
      europe: 0.003
      east_asia: 0.004
      south_asia: 0.005
      southeast_asia: 0.004
      latin_america: 0.003
      sub_saharan_africa: 0.005
      fsu_central_asia: 0.004
    units: dimensionless per mm
    category: judgment
    source: Regional conversion of water deficit to yield-fraction penalty
    used_by: [soil_n_model.RegionParams, coupled_monthly.MonthlyBiophysicalEngine]
    affects_claims: [C-014]
    mc: declared_fixed
    mc_exempt_reason: >-
      Converts a water deficit into a yield-fraction penalty inside
      _water_stress, multiplying whc_sensitivity along the SOC-to-yield water
      pathway. whc_sensitivity is drawn across a factor of 3.65 (0.657x to
      2.40x), which is the wider of the two and dominates the product. SI
      limitation: the water pathway carries one multiplier of uncertainty; how
      much water a percentage point of SOC holds and how much yield a
      millimetre of water buys are not separately identified.

  baseline_water_deficit:
    value:
      north_america: 0.0
      europe: 0.0
      east_asia: 5.0
      south_asia: 10.0
      southeast_asia: 5.0
      latin_america: 0.0
      sub_saharan_africa: 15.0
      fsu_central_asia: 10.0
    units: mm
    category: judgment
    source: Regional constant offset standing in for a growing-season climatology
    used_by: [soil_n_model.RegionParams, coupled_monthly.MonthlyBiophysicalEngine]
    affects_claims: [C-014]
    mc: declared_fixed
    mc_exempt_reason: >-
      A regional constant offset added inside
      coupled_monthly.MonthlyBiophysicalEngine._water_stress before the
      SOC-dependent water-holding term. It sets the LEVEL of water stress; the
      paper reports the CHANGE in stress that follows a change in SOC, which is
      governed by whc_sensitivity and water_stress_coeff. Held fixed because it
      is a judgment-coded stand-in for a climatology the model does not
      otherwise carry, so a prior on it would express a precision the
      underlying quantity does not have. SI limitation: absolute water-stress
      levels carry no interval; only the SOC-driven change does.

  physical_feedback_strength:
    value: 1.0
    units: dimensionless
    category: judgment
    source: Switch scaling the SOC-to-water physical feedback; 1.0 is fully on
    used_by: [soil_n_model.FeedbackParams]
    mc: exempt
    mc_exempt_reason: >-
      Perfectly collinear with whc_sensitivity, which does enter the ensemble.
      Varying both would double-count the same uncertainty.

  texture_class:
    value:
      north_america: 1
      europe: 1
      east_asia: 1
      south_asia: 1
      southeast_asia: 1
      latin_america: 1
      sub_saharan_africa: 0
      fsu_central_asia: 1
    units: dimensionless
    category: judgment
    source: Coarse categorical texture label; 0 = coarse, 1 = medium
    used_by: [soil_n_model.RegionParams]
    mc: exempt
    mc_exempt_reason: >-
      A categorical label with no continuous perturbation, and it does not
      currently modify any coefficient. F-011 scores it DECLARED_NOT_WIRED. If
      the mutation harness confirms it is unused it should be deleted rather
      than exempted.

  # -------------------------------------------------------------------
  # Nitrogen supply
  # -------------------------------------------------------------------

  synth_n_current:
    value:
      north_america: 76.0
      europe: 85.0
      east_asia: 250.0
      south_asia: 110.0
      southeast_asia: 89.0
      latin_america: 50.0
      sub_saharan_africa: 7.0
      fsu_central_asia: 38.0
    units: kg_N per ha
    category: measured
    source: IFA regional nitrogen consumption divided by FAOSTAT cropland area, 2019-2021
    used_by: [soil_n_model.RegionParams, coupled_econ_biophysical.CoupledModel]
    affects_claims: [C-030, C-031, C-070]
    mc: declared_fixed
    mc_exempt_reason: >-
      The observed regional application rate, which also defines the scenario:
      the disruption is specified as a fractional reduction from it, so a draw
      would rescale the shock rather than express uncertainty about it. Its
      measurement uncertainty reaches the reported outcomes through the cost
      share, where the drawn nitrogen-price multiplier carries it. SI
      limitation: FAOSTAT application rates are treated as known, so a region
      whose reported rate is biased has a proportionally biased baseline and
      shock.

  atm_n_deposition:
    value:
      north_america: 10.0
      europe: 12.0
      east_asia: 20.0
      south_asia: 12.0
      southeast_asia: 8.0
      latin_america: 5.0
      sub_saharan_africa: 5.0
      fsu_central_asia: 5.0
    units: kg_N per ha per year
    category: measured
    source: Regional total reactive nitrogen deposition to cropland
    used_by: [soil_n_model.RegionParams, monthly_model_v3.run_model]
    affects_claims: [C-070]
    mc: declared_fixed
    mc_exempt_reason: >-
      Added to mineral nitrogen every month in both the baseline and the
      disrupted run (monthly_model_v3:260), so it cancels to first order in the
      reported differences and what survives is second-order through the
      curvature of the yield-nitrogen response. Held fixed because the
      deposition field is a spatially interpolated product, and resampling it
      as eight independent regional multipliers would treat a spatially
      structured error as independent noise. SI limitation: the reported losses
      are conditional on fixed deposition, and the residual sensitivity is
      largest where deposition is the largest share of total nitrogen supply,
      which is sub-Saharan Africa (5 of about 40 kg N/ha) rather than east
      Asia, where deposition is largest in absolute terms (20 of about 340).

