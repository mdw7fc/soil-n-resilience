      RegionParams carries and what the canonical artifact reports. The code is
      authoritative; Table S1 owes the edit on regeneration.
    mc: declared_fixed
    mc_exempt_reason: >-
      Superseded. Drawing it would perturb a reported column and no modelled
      quantity. SI limitation: the parameter table must not present
